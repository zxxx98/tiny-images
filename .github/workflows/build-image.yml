name: build-image

on:
  push:
    branches: [main]

# 同一分支只保留最新一次运行，取消旧的
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与测试（server）
        run: |
          npm run build -w server
          npm test -w server

      - name: 构建 web
        run: npm run build -w web

      # 产物打包：测试通过后重装纯生产依赖（server 生产依赖均为纯 JS，双架构通用），
      # 镜像只做 COPY，多架构构建无需 QEMU
      - name: 准备镜像产物（ci-dist）
        run: |
          npm ci --omit=dev -w server
          mkdir -p ci-dist/server-dist ci-dist/web-dist ci-dist/server ci-dist/server/node_modules
          cp Dockerfile.ci ci-dist/
          cp package.json package-lock.json ci-dist/
          cp server/package.json ci-dist/server/package.json
          cp -r node_modules ci-dist/node_modules
          # 版本冲突的依赖可能嵌套装在 workspace 内（如 @fastify/static），一并拷贝
          if [ -d server/node_modules ]; then cp -r server/node_modules ci-dist/server/node_modules; fi
          cp -r server/dist/* ci-dist/server-dist/
          cp -r web/dist/* ci-dist/web-dist/
          tar -czf ci-dist.tgz -C ci-dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ci-dist
          path: ci-dist.tgz
          retention-days: 3

  docker:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-dist

      - name: 解包产物
        run: mkdir ci-dist && tar -xzf ci-dist.tgz -C ci-dist

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta（tags：latest / 分支名 / sha）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ci-dist
          file: ci-dist/Dockerfile.ci
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
