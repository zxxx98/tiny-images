services:
  tiny-images:
    build: .
    container_name: tiny-images
    ports:
      - "3000:3000"
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - CLOUDFLARE_IMAGES_ENABLED=${CLOUDFLARE_IMAGES_ENABLED:-false}
      - CLOUDFLARE_IMAGES_BASE_URL=${CLOUDFLARE_IMAGES_BASE_URL:-}
      - CLOUDFLARE_IMAGES_TIMEOUT_MS=${CLOUDFLARE_IMAGES_TIMEOUT_MS:-120000}
      - UPSCALE_MAX_INPUT_BYTES=${UPSCALE_MAX_INPUT_BYTES:-20971520}
      - UPSCALE_MAX_INPUT_PIXELS=${UPSCALE_MAX_INPUT_PIXELS:-40000000}
      - UPSCALE_MAX_DIMENSION=${UPSCALE_MAX_DIMENSION:-8192}
      - UPSCALE_MAX_OUTPUT_BYTES=${UPSCALE_MAX_OUTPUT_BYTES:-52428800}
      - UPSCALE_CONCURRENCY=${UPSCALE_CONCURRENCY:-2}
    volumes:
      - tiny-data:/data
    restart: unless-stopped

volumes:
  tiny-data:
