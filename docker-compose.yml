services:
  tiny-images:
    build: .
    container_name: tiny-images
    ports:
      - "3000:3000"
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    volumes:
      - tiny-data:/data
    restart: unless-stopped

volumes:
  tiny-data:
